<h1>Referência de configuração</h1>
<p>O tema usa um arquivo JavaScript simples para montar os menus.</p>

<h2>Uma aba</h2>
<pre><code>{
  id: 'guias',
  title: 'Guias',
  pages: []
}</code></pre>

<h2>Uma página</h2>
<pre><code>{
  title: 'Introdução',
  file: 'introducao.html',
  icon: '📘'
}</code></pre>

<p>O campo <code>icon</code> é opcional. O arquivo precisa existir em <code>site/pages/</code>.</p>
